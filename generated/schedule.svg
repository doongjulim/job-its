<svg width="500" height="290" viewBox="0 0 500 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="잡있으 일정과 공부">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: rgb(72, 148, 224); }
  .sub { font-size: 11px; fill: rgb(145, 145, 145); }
  .head { font-size: 12px; font-weight: 600; fill: rgb(139, 139, 139); }
  .name { font-size: 13px; font-weight: 600; fill: rgb(139, 139, 139); }
  .text { font-size: 12px; fill: rgb(145, 145, 145); }
  .small { font-size: 11px; fill: rgb(145, 145, 145); }
  .accent { fill: rgb(72, 148, 224); font-weight: 600; }
  .warn { fill: rgb(229, 83, 75); font-weight: 600; }
  .row { animation: fadeIn 0.5s ease-in-out backwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
<rect x="0.5" y="0.5" rx="6" width="499" height="289" fill="none" stroke="#8B8B8B22"/>
