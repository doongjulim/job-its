# 잡있으 — github-stats-transparent 와 같은 구조:
# 크론으로 실행 → generated/ 결과물 생성 → output 브랜치에 강제 푸시 → README 가 그 파일을 임베드
name: job-its

on:
  schedule:
    - cron: "13 23 * * *"     # 매일 08:13 KST — 새 공고 + 아침 브리핑
    - cron: "13 9 * * 1-5"    # 평일 18:13 KST — 새 공고만
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:
    branches: [ main ]
    paths: [ "config/**" ]     # 설정 바꾸면 대시보드만 다시 그림 (알림 없음)

permissions:
  contents: write              # output 브랜치 푸시
  issues: write                # JOBITS_ISSUES=true 일 때 새 공고를 이슈로

concurrency:
  group: job-its
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 지난 실행에서 본 공고 목록을 output 브랜치에서 복원 (없으면 첫 실행)
      - name: Restore state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin output > /dev/null; then
            git fetch origin output --depth=1
            git show origin/output:state/seen-jobs.json > state/seen-jobs.json 2>/dev/null || rm -f state/seen-jobs.json
          fi

      - name: Run job-its
        run: |
          chmod +x gradlew
          ./gradlew run --no-daemon -q
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBITS_ISSUES: ${{ vars.JOBITS_ISSUES }}
          JOBITS_MODE: ${{ github.event.schedule == '13 9 * * 1-5' && 'jobs-only' || 'full' }}
          JOBITS_NOTIFY: ${{ github.event_name != 'push' }}

      # 결과물 + 상태만 담은 output 브랜치를 새로 만들어 덮어쓴다
      - name: Publish to output branch
        run: |
          git config --global user.name "job-its[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp -r generated state /tmp/publish/
          git checkout --orphan output-tmp
          git rm -rf . -q
          cp -r /tmp/publish/generated /tmp/publish/state .
          git add generated state
          git commit -q -m "Update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push -f origin output-tmp:output
